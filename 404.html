<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Not Found</title>

  <!-- Optional: reuse your site's font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0d1117;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #58a6ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 20px;
    }

    .code {
      font-size: 6rem;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .message {
      font-size: 1.25rem;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid var(--accent);
      color: var(--accent);
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--accent);
      color: #0d1117;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <div class="message">Request failed: endpoint not found.</div>
    <a href="/" class="btn">Return to Home</a>
  </div>
</body>
</html>
